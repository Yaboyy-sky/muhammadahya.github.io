    // --- COMPONENT: AURORA CANVAS ---
    function AuroraCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const particleCount = Math.floor(Math.min(width, 1400) / 25);
        const particles = [];
        const colors = [
          'rgba(16, 185, 129, ',
          'rgba(52, 211, 153, ',
          'rgba(139, 92, 246, ',
          'rgba(168, 85, 247, ',
          'rgba(6, 182, 212, ',
        ];

        for (let i = 0; i < particleCount; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 2.2 + 0.8,
            colorBase: colors[Math.floor(Math.random() * colors.length)],
            baseAlpha: Math.random() * 0.45 + 0.15,
            alpha: 0.2,
            pulseSpeed: Math.random() * 0.02 + 0.008,
            pulseVal: Math.random() * Math.PI * 2,
            vx: (Math.random() - 0.5) * 0.35,
            vy: -Math.random() * 0.45 - 0.15,
          });
        }

        let time = 0;
        const render = () => {
          time += 0.006;
          ctx.clearRect(0, 0, width, height);

          // Aurora Ribbon 1: Green Tosca & Cyan
          const grad1 = ctx.createLinearGradient(0, 0, width, height * 0.75);
          grad1.addColorStop(0, 'rgba(16, 185, 129, 0.18)');
          grad1.addColorStop(0.35, 'rgba(6, 182, 212, 0.12)');
          grad1.addColorStop(0.7, 'rgba(139, 92, 246, 0.15)');
          grad1.addColorStop(1, 'rgba(0, 0, 0, 0)');

          ctx.save();
          ctx.fillStyle = grad1;
          ctx.beginPath();
          ctx.moveTo(0, 0);

          const waveSteps = 8;
          const stepX = width / waveSteps;
          for (let i = 0; i <= waveSteps; i++) {
            const cx = i * stepX;
            const cy = Math.sin(time + i * 0.7) * 70 + Math.cos(time * 0.7 + i * 0.4) * 45 + height * 0.28;
            if (i === 0) ctx.lineTo(cx, cy);
            else {
              const prevX = (i - 1) * stepX;
              const prevY = Math.sin(time + (i - 1) * 0.7) * 70 + Math.cos(time * 0.7 + (i - 1) * 0.4) * 45 + height * 0.28;
              ctx.quadraticCurveTo(prevX, prevY, (prevX + cx) / 2, (prevY + cy) / 2);
            }
          }
          ctx.lineTo(width, 0);
          ctx.closePath();
          ctx.fill();
          ctx.restore();

          // Aurora Ribbon 2: Purple & Magenta Glow
          const grad2 = ctx.createLinearGradient(width, 0, 0, height * 0.65);
          grad2.addColorStop(0, 'rgba(139, 92, 246, 0.16)');
          grad2.addColorStop(0.5, 'rgba(16, 185, 129, 0.10)');
          grad2.addColorStop(1, 'rgba(0, 0, 0, 0)');

          ctx.save();
          ctx.fillStyle = grad2;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          for (let i = 0; i <= waveSteps; i++) {
            const cx = i * stepX;
            const cy = Math.sin(time * 1.2 + i * 0.9 + 2) * 55 + Math.sin(time * 0.5 + i * 0.5) * 35 + height * 0.22;
            if (i === 0) ctx.lineTo(cx, cy);
            else {
              const prevX = (i - 1) * stepX;
              const prevY = Math.sin(time * 1.2 + (i - 1) * 0.9 + 2) * 55 + Math.sin(time * 0.5 + (i - 1) * 0.5) * 35 + height * 0.22;
              ctx.quadraticCurveTo(prevX, prevY, (prevX + cx) / 2, (prevY + cy) / 2);
            }
          }
          ctx.lineTo(width, 0);
          ctx.closePath();
          ctx.fill();
          ctx.restore();

          // Particles
          particles.forEach((p) => {
            p.pulseVal += p.pulseSpeed;
            p.alpha = p.baseAlpha + Math.sin(p.pulseVal) * 0.2;
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < -10) p.x = width + 10;
            if (p.x > width + 10) p.x = -10;
            if (p.y < -10) {
              p.y = height + 10;
              p.x = Math.random() * width;
            }

            const pGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 3.5);
            pGrad.addColorStop(0, `${p.colorBase}${Math.max(0, p.alpha)})`);
            pGrad.addColorStop(1, `${p.colorBase}0)`);

            ctx.fillStyle = pGrad;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius * 3.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = `${p.colorBase}${Math.min(1, p.alpha * 1.8)})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius * 0.8, 0, Math.PI * 2);
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-[1] opacity-90" />;
    }

    // --- COMPONENT: FALLING LEAVES ---
    function FallingLeaves() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const leafCount = Math.floor(Math.min(width, 1400) / 45);
        const leaves = [];
        const leafColors = [
          { fill: 'rgba(16, 185, 129, 0.45)', stroke: 'rgba(52, 211, 153, 0.6)' },
          { fill: 'rgba(5, 150, 105, 0.40)', stroke: 'rgba(16, 185, 129, 0.5)' },
          { fill: 'rgba(4, 120, 87, 0.35)', stroke: 'rgba(52, 211, 153, 0.4)' },
          { fill: 'rgba(20, 83, 45, 0.38)', stroke: 'rgba(16, 185, 129, 0.35)' },
          { fill: 'rgba(139, 92, 246, 0.30)', stroke: 'rgba(192, 132, 252, 0.5)' },
        ];

        for (let i = 0; i < leafCount; i++) {
          leaves.push({
            x: Math.random() * width,
            y: Math.random() * height - height * 0.2,
            size: Math.random() * 8 + 7,
            speedY: Math.random() * 0.75 + 0.45,
            speedX: Math.random() * 0.5 + 0.25,
            angle: Math.random() * Math.PI * 2,
            angularSpeed: (Math.random() - 0.5) * 0.02,
            oscillationSpeed: Math.random() * 0.02 + 0.01,
            oscillationDist: Math.random() * 1.5 + 0.8,
            timeOffset: Math.random() * 100,
            color: leafColors[Math.floor(Math.random() * leafColors.length)],
          });
        }

        const drawLeaf = (ctx, x, y, size, angle, color) => {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle);

          ctx.beginPath();
          ctx.moveTo(0, -size);
          ctx.quadraticCurveTo(-size * 0.6, -size * 0.2, -size * 0.4, size * 0.4);
          ctx.quadraticCurveTo(-size * 0.2, size * 0.8, 0, size);
          ctx.quadraticCurveTo(size * 0.2, size * 0.8, size * 0.4, size * 0.4);
          ctx.quadraticCurveTo(size * 0.6, -size * 0.2, 0, -size);
          ctx.closePath();

          ctx.fillStyle = color.fill;
          ctx.fill();

          ctx.strokeStyle = color.stroke;
          ctx.lineWidth = 0.8;
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(0, -size * 0.8);
          ctx.lineTo(0, size * 0.85);
          ctx.stroke();

          ctx.restore();
        };

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          leaves.forEach((leaf) => {
            leaf.timeOffset += leaf.oscillationSpeed;
            const sway = Math.sin(leaf.timeOffset) * leaf.oscillationDist;
            leaf.x += leaf.speedX + sway;
            leaf.y += leaf.speedY;
            leaf.angle += leaf.angularSpeed + sway * 0.01;

            if (leaf.y > height + 20) {
              leaf.y = -20;
              leaf.x = Math.random() * (width * 0.9);
            }
            if (leaf.x > width + 20) {
              leaf.x = -20;
              leaf.y = Math.random() * height * 0.5;
            }

            drawLeaf(ctx, leaf.x, leaf.y, leaf.size, leaf.angle, leaf.color);
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-[2] opacity-80" />;
    }

    // --- COMPONENT: ANIMATED COUNTER ---
    function AnimatedCounter({ endValue, suffix = '', duration = 1800 }) {
      const [count, setCount] = useState(0);
      const counterRef = useRef(null);
      const [hasAnimated, setHasAnimated] = useState(false);

      useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting && !hasAnimated) {
              setHasAnimated(true);
              let startTime = null;
              const step = (timestamp) => {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                const easeOutProgress = 1 - Math.pow(1 - progress, 3);
                setCount(Math.floor(easeOutProgress * endValue));

                if (progress < 1) {
                  window.requestAnimationFrame(step);
                } else {
                  setCount(endValue);
                }
              };
              window.requestAnimationFrame(step);
            }
          },
          { threshold: 0.3 }
        );

        if (counterRef.current) {
          observer.observe(counterRef.current);
        }

        return () => observer.disconnect();
      }, [endValue, duration, hasAnimated]);

      return (
        <span ref={counterRef} className="tabular-nums">
          {count}
          {suffix}
        </span>
      );
    }

    function ProjectCard({ project }) {
      const cardRef = useRef(null);
      const [rotateX, setRotateX] = useState(0);
      const [rotateY, setRotateY] = useState(0);
      const [spotlightPos, setSpotlightPos] = useState({ x: 50, y: 50 });
      const [isHovered, setIsHovered] = useState(false);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        setRotateX(-((y - centerY) / centerY) * 10);
        setRotateY(((x - centerX) / centerX) * 10);
        setSpotlightPos({
          x: (x / rect.width) * 100,
          y: (y / rect.height) * 100,
        });
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseEnter={() => setIsHovered(true)}

    // --- COMPONENT: CONTACT ---
    function Contact() {
      const [formData, setFormData] = useState({
        name: '',
        email: '',
        subject: '',
        message: '',
      });
      const [errors, setErrors] = useState({});
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [submitError, setSubmitError] = useState(null);

      const validate = () => {
        const errs = {};
        if (!formData.name.trim()) errs.name = 'Nama lengkap wajib diisi.';
        else if (formData.name.trim().length < 2) errs.name = 'Nama minimal 2 karakter.';

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!formData.email.trim()) errs.email = 'Alamat email wajib diisi.';
        else if (!emailRegex.test(formData.email.trim())) errs.email = 'Format email tidak valid (contoh: nama@domain.com).';

        if (!formData.subject.trim()) errs.subject = 'Subjek pesan tidak boleh kosong.';
        else if (formData.subject.trim().length < 3) errs.subject = 'Subjek minimal 3 karakter.';

        if (!formData.message.trim()) errs.message = 'Isi pesan tidak boleh kosong.';
        else if (formData.message.trim().length < 10) errs.message = 'Pesan terlalu singkat (minimal 10 karakter).';

        return errs;
      };

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData((prev) => ({ ...prev, [name]: value }));
        if (errors[name]) {
          setErrors((prev) => ({ ...prev, [name]: undefined }));
        }
        if (submitError) {
          setSubmitError(null);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        const errs = validate();
        if (Object.keys(errs).length > 0) {
          setErrors(errs);
          return;
        }

        setIsSubmitting(true);
        setErrors({});
        setSubmitError(null);

        try {
          const response = await fetch("https://formspree.io/f/maeelnye", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json",
            },
            body: JSON.stringify({
              name: formData.name,
              email: formData.email,
              subject: formData.subject,
              message: formData.message,
              _replyto: formData.email,
            }),
          });

          if (response.ok) {
            setIsSubmitted(true);
            setFormData({ name: '', email: '', subject: '', message: '' });
            setTimeout(() => setIsSubmitted(false), 8000);
          } else {
            const data = await response.json().catch(() => ({}));
            if (data.errors && data.errors.length > 0) {
              setSubmitError(data.errors.map((err) => err.message).join(', '));
            } else {
              setSubmitError('Terjadi kendala saat mengirim pesan ke Formspree. Silakan coba lagi atau kirim langsung ke email.');
            }
          }
        } catch (err) {
          console.error(err);
          setSubmitError('Gagal menghubungkan ke server. Silakan periksa koneksi internet Anda atau hubungi langsung via email.');
        } finally {
          setIsSubmitting(false);
        }
      };

      const getSocialIcon = (name) => {
        switch (name.toLowerCase()) {
          case 'github': return '🐙';
          case 'linkedin': return '💼';
          case 'instagram': return '📸';
          case 'discord': return '🎮';
          case 'whatsapp': return '💬';
          default: return '✉️';

      return (
        <section id="contact" className="relative py-24 px-4 md:px-8 max-w-6xl mx-auto">
          <div className="text-center mb-16">

            </div>
            <h2 className="text-3xl sm:text-4xl md:text-5xl font-extrabold text-white tracking-tight">
              Hubungi <span className="aurora-gradient-text">Saya</span>
            </h2>
            <div className="w-24 h-1 bg-gradient-to-r from-emerald-500 to-purple-600 mx-auto mt-4 rounded-full" />
            <p className="text-gray-300 max-w-2xl mx-auto mt-4 text-sm sm:text-base font-light leading-relaxed">
              Punya ide proyek menarik, tawaran kerja, atau sekadar ingin berdiskusi seputar instrumentasi, kelistrikan, teknologi, dan desain kreatif? Jangan ragu untuk mengirimkan pesan!
            </p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-10">
            {/* Contact Details & Social Links */}
            <div className="lg:col-span-5 space-y-6">
              <div className="glass-panel p-6 sm:p-8 rounded-3xl space-y-6">
                <h3 className="text-xl font-bold text-white mb-4">
                  Informasi Kontak
                </h3>

                <div className="flex items-start gap-4">
                  <div className="p-3 rounded-2xl bg-emerald-500/15 border border-emerald-400/30 text-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.3)] text-xl">

                  <div>
                    <p className="text-xs text-gray-400 font-medium">Alamat Email</p>
                    <a
                      href={`mailto:${personalInfo.email}`}
                      className="text-sm sm:text-base font-semibold text-emerald-300 hover:text-emerald-200 transition-colors"
                    >
                      {personalInfo.email}

                  </div>
                </div>

                <div className="flex items-start gap-4">

                  </div>
                </div>

                <div className="p-4 rounded-2xl bg-forest-900/60 border border-emerald-500/20 text-xs text-gray-300">
                  <p className="text-emerald-300 font-semibold mb-1">⏱️ Waktu Respon Cepat</p>
                  <p className="text-gray-400">Pesan terkirim langsung ke inbox email saya dan biasanya direspon dalam waktu 24 jam.</p>
                </div>
              </div>

              {/* Animated Social Links */}
              <div className="glass-panel p-6 sm:p-8 rounded-3xl">
                <h3 className="text-lg font-bold text-white mb-4">
                  Koneksi Sosial Media
                </h3>
                <div className="space-y-3">
                  {socialLinks.map((social, idx) => (
                    <a
                      key={idx}
                      href={social.url}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="group flex items-center justify-between p-3 rounded-2xl bg-forest-900/40 border border-emerald-500/15 hover:border-emerald-400/60 hover:bg-forest-850 hover:shadow-[0_0_20px_rgba(16,185,129,0.25)] transition-all duration-300"
                    >
                      <div className="flex items-center gap-3">
                        <div className="p-2.5 rounded-xl bg-[#031109] border border-emerald-500/20 text-lg group-hover:scale-110 group-hover:rotate-6 transition-all duration-300 shadow-[0_0_10px_rgba(16,185,129,0.2)]">
                          {getSocialIcon(social.name)}
                        </div>
                        <div>
                          <p className="text-sm font-semibold text-white group-hover:text-emerald-300 transition-colors">
                            {social.name}
                          </p>
                          <p className="text-xs text-gray-400 font-mono">
                            {social.username}
                          </p>
                        </div>
                      </div>
                      <span className="text-gray-500 group-hover:text-emerald-400 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform">
                        ↗
                      </span>
                    </a>
                  ))}
                </div>
              </div>
            </div>

            {/* Form */}
            <div className="lg:col-span-7">
              <div className="glass-panel p-6 sm:p-10 rounded-3xl relative">
                <h3 className="text-xl sm:text-2xl font-bold text-white mb-2">
                  Kirim Pesan Langsung
                </h3>
                <p className="text-xs sm:text-sm text-gray-400 mb-6">
                  Isi formulir di bawah ini dengan lengkap untuk memulai percakapan.
                </p>

                {/* Success Banner */}
                {isSubmitted && (
                  <div className="mb-6 p-5 rounded-2xl bg-emerald-950/90 border border-emerald-400 shadow-[0_0_30px_rgba(16,185,129,0.5)] flex items-start gap-3 animate-fadeIn">
                    <span className="text-emerald-400 text-xl font-bold">✔</span>
                    <div>
                      <p className="text-sm font-bold text-white">
                        Pesan Berhasil Terkirim ke Email Muhammad Ahya!
                      </p>
                      <p className="text-xs text-emerald-200/90 mt-1 leading-relaxed">
                        Terima kasih telah menghubungi saya. Pesan Anda telah diteruskan langsung ke kotak masuk saya dan saya akan segera membalasnya secepat mungkin!
                      </p>
                    </div>
                  </div>
                )}

                {/* Error Banner */}
                {submitError && (
                  <div className="mb-6 p-4 rounded-2xl bg-red-950/80 border border-red-500 shadow-[0_0_20px_rgba(239,68,68,0.3)] flex items-start gap-3 animate-fadeIn">
                    <span className="text-red-400 text-lg">⚠</span>
                    <div>
                      <p className="text-sm font-bold text-white">
                        Gagal Mengirim Pesan
                      </p>
                      <p className="text-xs text-red-200 mt-1">
                        {submitError}
                      </p>
                    </div>
                  </div>
                )}

                <form onSubmit={handleSubmit} noValidate className="space-y-5">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                      <label className="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">
                        Nama Lengkap <span className="text-emerald-400">*</span>
                      </label>
                      <input
                        type="text"
                        name="name"
                        value={formData.name}
                        onChange={handleChange}
                        placeholder="Contoh: Budi Wijaya"
                        className={`w-full px-4 py-3 rounded-xl bg-forest-900/70 border text-sm text-white placeholder-gray-500 focus:outline-none transition-all ${
                          errors.name
                            ? 'border-red-500/80 shadow-[0_0_12px_rgba(239,68,68,0.3)]'
                            : 'border-emerald-500/25 focus:border-emerald-400 focus:shadow-[0_0_15px_rgba(16,185,129,0.3)]'
                        }`}
                      />
                      {errors.name && (
                        <p className="mt-1.5 text-xs text-red-400 font-medium">
                          ⚠ {errors.name}
                        </p>
                      )}
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">
                        Email Anda <span className="text-emerald-400">*</span>
                      </label>
                      <input
                        type="email"
                        name="email"
                        value={formData.email}
                        onChange={handleChange}
                        placeholder="nama@gmail.com"
                        className={`w-full px-4 py-3 rounded-xl bg-forest-900/70 border text-sm text-white placeholder-gray-500 focus:outline-none transition-all ${
                          errors.email
                            ? 'border-red-500/80 shadow-[0_0_12px_rgba(239,68,68,0.3)]'
                            : 'border-emerald-500/25 focus:border-emerald-400 focus:shadow-[0_0_15px_rgba(16,185,129,0.3)]'
                        }`}
                      />
                      {errors.email && (
                        <p className="mt-1.5 text-xs text-red-400 font-medium">
                          ⚠ {errors.email}
                        </p>
                      )}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">
                      Subjek Pesan <span className="text-emerald-400">*</span>
                    </label>
                    <input
                      type="text"
                      name="subject"
                      value={formData.subject}
                      onChange={handleChange}
                      placeholder="Peluang Karier / Rekrutmen / Kolaborasi Profesional"
                      className={`w-full px-4 py-3 rounded-xl bg-forest-900/70 border text-sm text-white placeholder-gray-500 focus:outline-none transition-all ${
                        errors.subject
                      ? 'border-red-500/80 shadow-[0_0_12px_rgba(239,68,68,0.3)]'
                      : 'border-emerald-500/25 focus:border-emerald-400 focus:shadow-[0_0_15px_rgba(16,185,129,0.3)]'
                      }`}
                    />
                    {errors.subject && (
                      <p className="mt-1.5 text-xs text-red-400 font-medium">
                        ⚠ {errors.subject}
                      </p>
                    )}
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">
                      Pesan Anda <span className="text-emerald-400">*</span>
                    </label>
                    <textarea
                      name="message"
                      rows={5}
                      value={formData.message}
                      onChange={handleChange}
                      placeholder="Tuliskan detail pertanyaan atau brief proyek Anda di sini..."
                      className={`w-full px-4 py-3 rounded-xl bg-forest-900/70 border text-sm text-white placeholder-gray-500 focus:outline-none transition-all resize-none ${
                        errors.message
                          ? 'border-red-500/80 shadow-[0_0_12px_rgba(239,68,68,0.3)]'
                          : 'border-emerald-500/25 focus:border-emerald-400 focus:shadow-[0_0_15px_rgba(16,185,129,0.3)]'
                      }`}
                    />
                    {errors.message && (
                      <p className="mt-1.5 text-xs text-red-400 font-medium">
                        ⚠ {errors.message}
                      </p>
                    )}
                  </div>

                  <button
                    type="submit"
                    disabled={isSubmitting}
                    className="w-full py-4 rounded-2xl font-bold text-sm sm:text-base text-white bg-gradient-to-r from-emerald-500 via-teal-500 to-purple-600 hover:from-emerald-400 hover:to-purple-500 shadow-[0_0_25px_rgba(16,185,129,0.4)] hover:shadow-[0_0_35px_rgba(139,92,246,0.5)] transition-all duration-300 flex items-center justify-center gap-2 transform active:scale-[0.99] disabled:opacity-70 disabled:cursor-not-allowed"
                  >
                    {isSubmitting ? (
                      <>
                        <span className="inline-block animate-spin">🌀</span>
                        <span>Mengirimkan Pesan ke Inbox Email...</span>
                      </>
                    ) : (
                      <>
                        <span>✉️</span>
                        <span>Kirim Pesan Sekarang</span>
                      </>
                    )}
                  </button>
                </form>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // --- COMPONENT: FOOTER ---
    function Footer() {
      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <footer className="relative mt-20 border-t border-emerald-900/30 bg-[#020a06]/90 backdrop-blur-md">
          <div className="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 max-w-4xl h-[1px] bg-gradient-to-r from-transparent via-emerald-500 to-transparent opacity-75 shadow-[0_0_15px_#10b981]" />

          <div className="max-w-6xl mx-auto px-4 md:px-8 py-12 flex flex-col md:flex-row items-center justify-between gap-6">
            <div className="text-center md:text-left">
              <div className="flex items-center justify-center md:justify-start gap-2 mb-2">
                <span className="text-emerald-400">✨</span>
                <span className="font-extrabold text-base tracking-wider uppercase aurora-gradient-text">
                  {personalInfo.name}
                </span>
              </div>
              <p className="text-xs text-gray-400 max-w-sm">
                Ruang eksplorasi yang merepresentasikan kompetensi, pengalaman, dan karya dalam bidang instrumentasi, teknologi, serta kreativitas digital.
              </p>
            </div>

            <div className="flex items-center gap-2 text-xs font-medium text-emerald-300/90 bg-emerald-950/40 border border-emerald-500/25 px-4 py-2 rounded-full shadow-[0_0_15px_rgba(16,185,129,0.15)]">
              <span>Berkarya dengan Logika, Berinovasi dengan Kreativitas</span>
              <span className="text-purple-400">✨</span>
            </div>

            <button
              onClick={scrollToTop}
              className="group flex items-center gap-2 px-4 py-2 rounded-xl bg-forest-900/70 border border-emerald-500/20 text-xs font-semibold text-emerald-300 hover:text-white hover:border-emerald-400/50 hover:shadow-[0_0_15px_rgba(16,185,129,0.3)] transition-all"
            >
              <span>Kembali ke Atas</span>
              <span className="group-hover:-translate-y-1 transition-transform">↑</span>
            </button>
          </div>

          <div className="border-t border-emerald-950/60 py-4 text-center text-[11px] text-gray-500">
            © {new Date().getFullYear()} {personalInfo.name}. Seluruh Hak Cipta Dilindungi.
          </div>
        </footer>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      return (
        <div className="relative min-h-screen bg-[#020a06] text-slate-100 overflow-x-hidden selection:bg-emerald-500/30 selection:text-emerald-300">
          <AuroraCanvas />
          <FallingLeaves />
          <FogEffect />
          <Navbar />
          <main className="relative z-10">
            <Hero />
            <About />
            <Portfolio />
            <Contact />
          </main>
          <Footer />
        </div>
      );
    }

    // Mount to Root DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
